<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alertas de Estoque')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('alertas')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Alertas de Estoque Baixo</h3>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th># ID</th>
                    <th>Produto</th>
                    <th>Mensagem</th>
                    <th>Data do Alerta</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alerta : ${alertas}" class="table-danger">
                    <td class="fw-bold" th:text="${alerta.idAlerta}"></td>
                    <td class="fw-semibold" th:text="${alerta.produto.nomeProduto}"></td>
                    <td th:text="${alerta.mensagem}"></td>
                    <td th:text="${#temporals.format(alerta.dataAlerta, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(alertas)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        <i class="bi bi-check-circle text-success fs-2 d-block mb-2"></i>
                        Nenhum alerta de estoque no momento.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
