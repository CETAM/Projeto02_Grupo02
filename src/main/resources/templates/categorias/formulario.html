<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoria')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('categorias')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="card card-custom p-4 bg-white mx-auto" style="max-width: 500px;">
            <h4 class="fw-bold mb-4" th:text="${categoria.idCategoria != null} ? 'Editar Categoria' : 'Nova Categoria'"></h4>
            <form th:action="@{/categorias/salvar}" th:object="${categoria}" method="post">
                <input type="hidden" th:field="*{idCategoria}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome da Categoria *</label>
                    <input type="text" class="form-control" th:field="*{nomeCategoria}" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Descrição</label>
                    <textarea class="form-control" th:field="*{descricao}" rows="3"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/categorias}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-purple">Salvar</button>
                </div>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
