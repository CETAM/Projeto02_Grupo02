<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('categorias')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Categorias de Produtos</h3>
            <a th:href="@{/categorias/nova}" class="btn btn-purple"><i class="bi bi-tag-fill"></i> Nova Categoria</a>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th># ID</th>
                    <th>Nome da Categoria</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categorias}">
                    <td class="fw-bold" th:text="${cat.idCategoria}"></td>
                    <td class="fw-semibold text-primary" th:text="${cat.nomeCategoria}"></td>
                    <td th:text="${cat.descricao}"></td>
                    <td>
                        <a th:href="@{/categorias/editar/{id}(id=${cat.idCategoria})}" class="btn btn-outline-primary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/categorias/excluir/{id}(id=${cat.idCategoria})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Deseja excluir esta categoria?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
