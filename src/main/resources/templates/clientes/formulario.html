<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro de Cliente')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('clientes')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="card card-custom p-4 bg-white mx-auto" style="max-width: 600px;">
            <h4 class="fw-bold mb-4" th:text="${cliente.idCliente != null} ? 'Editar Cliente' : 'Novo Cliente'"></h4>
            <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{idCliente}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome Completo *</label>
                    <input type="text" class="form-control" th:field="*{nomeCliente}" th:classappend="${#fields.hasErrors('nomeCliente')} ? 'is-invalid'" required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nomeCliente')}" th:errors="*{nomeCliente}"></div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">CPF *</label>
                        <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Telefone</label>
                        <input type="text" class="form-control" th:field="*{telefone}" placeholder="(00) 00000-0000" th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">E-mail</label>
                    <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/clientes}" class="btn btn-light border">Cancelar</a>
                    <button type="submit" class="btn btn-purple">Salvar Cliente</button>
                </div>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
