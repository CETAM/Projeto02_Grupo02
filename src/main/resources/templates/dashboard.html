<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body class="d-flex">

<!-- Sidebar -->
<div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

<!-- Conteúdo Principal -->
<div class="flex-grow-1 d-flex flex-column" style="height: 100vh;">
    <!-- Topbar -->
    <nav th:replace="~{fragments/layout :: topbar}"></nav>

    <main class="p-4 overflow-auto flex-grow-1">
        <h3 class="fw-bold mb-4">Painel de Controle</h3>

        <!-- Cards Resumo -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-custom p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="text-muted small fw-bold text-uppercase">Clientes Cadastrados</div>
                            <div class="fs-2 fw-bold text-dark" th:text="${totalClientes != null ? totalClientes : 0}">0</div>
                        </div>
                        <div class="p-3 rounded-circle bg-primary bg-opacity-10 text-primary fs-3">
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-custom p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="text-muted small fw-bold text-uppercase">Total de Produtos</div>
                            <div class="fs-2 fw-bold text-dark" th:text="${totalProdutos != null ? totalProdutos : 0}">0</div>
                        </div>
                        <div class="p-3 rounded-circle bg-success bg-opacity-10 text-success fs-3">
                            <i class="bi bi-box-seam"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-custom p-3 bg-white">
                    <div class="d-flex align-items-center justify-content-between">
                        <div>
                            <div class="text-muted small fw-bold text-uppercase">Pedidos Registrados</div>
                            <div class="fs-2 fw-bold text-purple" th:text="${pedidosRecentes != null ? pedidosRecentes.size() : 0}">0</div>
                        </div>
                        <div class="p-3 rounded-circle bg-opacity-10 fs-3" style="background-color: rgba(124,58,237,0.1); color: #7c3aed;">
                            <i class="bi bi-cart-check"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="row mb-4 g-3">
            <!-- Gráfico de Vendas -->
            <div class="col-md-8">
                <div class="card card-custom p-4 bg-white h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Visão Geral de Vendas</h5>
                    </div>

                    <div th:if="${pedidosRecentes == null or pedidosRecentes.isEmpty()}" class="alert alert-warning d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                        <div>Nenhuma venda cadastrada até o momento.</div>
                    </div>

                    <div th:unless="${pedidosRecentes == null or pedidosRecentes.isEmpty()}" style="position: relative; height: 300px; width: 100%;">
                        <canvas id="graficoVendas"></canvas>
                    </div>
                </div>
            </div>

            <!-- Gráfico de Produtos Mais Vendidos -->
            <div class="col-md-4">
                <div class="card card-custom p-4 bg-white h-100 text-center">
                    <div class="mb-3">
                        <h5 class="fw-bold mb-0">Mais Vendidos</h5>
                        <small class="text-muted">Por quantidade</small>
                    </div>
                    <div style="position: relative; height: 300px; width: 100%;">
                        <canvas id="graficoMaisVendidos"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Pedidos Recentes -->
        <div class="card card-custom p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Pedidos Recentes</h5>
                <a th:href="@{/pedidos/novo}" class="btn btn-purple btn-sm"><i class="bi bi-plus-lg"></i> Novo Pedido</a>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th># ID</th>
                        <th>Cliente</th>
                        <th>Data</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${pedidosRecentes == null or pedidosRecentes.isEmpty()}">
                        <td colspan="6" class="text-center text-muted">Nenhum pedido recente encontrado.</td>
                    </tr>
                    <tr th:each="p : ${pedidosRecentes}">
                        <td class="fw-bold text-secondary" th:text="'PED-' + ${p.idPedido}"></td>
                        <td th:text="${p.cliente.nomeCliente}"></td>
                        <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-bold text-success" th:text="'R$ ' + ${p.valorTotal}"></td>
                        <td>
                            <span class="badge bg-success" th:if="${p.statusPedido == 'CONCLUIDA'}">Concluído</span>
                            <span class="badge bg-warning text-dark" th:unless="${p.statusPedido == 'CONCLUIDA'}">Pendente</span>
                        </td>
                        <td>
                            <a th:href="@{/pedidos/detalhes/{id}(id=${p.idPedido})}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-eye"></i></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- Chart.js para o Gráfico de Vendas -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        var labels = [];
        var values = [];

        /*[# th:each="p : ${pedidosRecentes}"]*/
        labels.push('PED-' + /*[[${p.idPedido}]]*/ '0');
        values.push(/*[[${p.valorTotal}]]*/ 0);
        /*[/]*/

        if (labels.length > 0) {
            labels.reverse();
            values.reverse();

            var ctx = document.getElementById('graficoVendas');
            if (ctx) {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Valor (R$)',
                            data: values,
                            borderColor: '#7c3aed',
                            backgroundColor: 'rgba(124, 58, 237, 0.2)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            pointBackgroundColor: '#7c3aed'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        }

        // Gráfico de Produtos Mais Vendidos (Dados Reais do BD)
        var ctxMaisVendidos = document.getElementById('graficoMaisVendidos');
        if (ctxMaisVendidos) {
            var labelsMaisVendidos = [];
            var valuesMaisVendidos = [];

            /*[# th:each="mv : ${maisVendidos}"]*/
            labelsMaisVendidos.push(/*[[${mv[0]}]]*/ 'Produto');
            valuesMaisVendidos.push(/*[[${mv[1]}]]*/ 0);
            /*[/]*/

            if (labelsMaisVendidos.length > 0) {
                new Chart(ctxMaisVendidos, {
                    type: 'bar',
                    data: {
                        labels: labelsMaisVendidos,
                        datasets: [{
                            data: valuesMaisVendidos,
                            backgroundColor: '#b347ff',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: {
                                display: true,
                                beginAtZero: true
                            },
                            y: {
                                display: true,
                                grid: { display: false }
                            }
                        }
                    }
                });
            } else {
                var chartContainer = ctxMaisVendidos.parentElement;
                chartContainer.innerHTML = '<div class="alert alert-info text-center mt-4">Nenhum produto vendido ainda.</div>';
            }
        }
    });
</script>
</body>
</html>
