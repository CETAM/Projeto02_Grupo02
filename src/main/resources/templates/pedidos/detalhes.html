<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalhes do Pedido')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('pedidos')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="card card-custom p-4 bg-white mx-auto" style="max-width: 750px;">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h4 class="fw-bold mb-1" th:text="'Pedido #' + ${pedido.idPedido}"></h4>
                    <span class="text-muted" th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></span>
                </div>
                <span class="badge bg-success fs-6" th:text="${pedido.statusPedido}"></span>
            </div>

            <div class="mb-4">
                <div class="text-muted small text-uppercase fw-bold">Cliente</div>
                <div class="fs-5 fw-semibold" th:text="${pedido.cliente.nomeCliente}"></div>
                <div class="text-secondary" th:text="'CPF: ' + ${pedido.cliente.cpf} + ' | E-mail: ' + ${pedido.cliente.email}"></div>
            </div>

            <h5 class="fw-bold mb-3">Itens Faturados</h5>
            <table class="table border align-middle mb-4">
                <thead class="table-light">
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Preço Unitário</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="it : ${pedido.itens}">
                    <td th:text="${it.produto.nomeProduto}"></td>
                    <td th:text="${it.quantidade}"></td>
                    <td th:text="'R$ ' + ${it.valorUnitario}"></td>
                    <td class="fw-bold" th:text="'R$ ' + ${it.valorUnitario * it.quantidade}"></td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <span class="fs-5 fw-bold">Total do Pedido:</span>
                <span class="fs-3 fw-bold text-success" th:text="'R$ ' + ${pedido.valorTotal}"></span>
            </div>

            <a th:href="@{/pedidos}" class="btn btn-light border w-100">Voltar para Lista</a>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
