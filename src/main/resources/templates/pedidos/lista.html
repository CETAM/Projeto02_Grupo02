<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('pedidos')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Gestão de Pedidos</h3>
            <a th:href="@{/pedidos/novo}" class="btn btn-purple"><i class="bi bi-cart-plus-fill"></i> Criar Novo Pedido</a>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th># Pedido</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Itens</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pedidos}">
                    <td class="fw-bold" th:text="'PED-' + ${p.idPedido}"></td>
                    <td class="fw-semibold" th:text="${p.cliente.nomeCliente}"></td>
                    <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${p.itens.size()} + ' item(ns)'"></td>
                    <td class="fw-bold text-success" th:text="'R$ ' + ${p.valorTotal}"></td>
                    <td><span class="badge bg-success" th:text="${p.statusPedido}"></span></td>
                    <td>
                        <a th:href="@{/pedidos/detalhes/{id}(id=${p.idPedido})}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-eye"></i> Detalhes</a>
                        <a th:href="@{/pedidos/{id}/pdf(id=${p.idPedido})}" target="_blank" class="btn btn-outline-danger btn-sm"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
