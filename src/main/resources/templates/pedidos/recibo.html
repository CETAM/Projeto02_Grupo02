<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Recibo do Pedido</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 2cm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: Arial, sans-serif;
                font-size: 10pt;
            }
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        p {
            margin: 5px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        thead {
            display: table-header-group;
            background-color: #f8f9fa;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            font-weight: bold;
            text-align: center;
        }
        .text-right {
            text-align: right;
        }
        .text-center {
            text-align: center;
        }
        .total {
            font-size: 14pt;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h2>Recibo do Pedido #<span th:text="${pedido.idPedido}"></span></h2>

<div>
    <p><strong>Data do Pedido:</strong> <span th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p><strong>Status:</strong> <span th:text="${pedido.statusPedido}"></span></p>
    <p><strong>Cliente:</strong> <span th:text="${pedido.cliente.nomeCliente}"></span></p>
    <p><strong>CPF:</strong> <span th:text="${pedido.cliente.cpf}"></span></p>
</div>

<table>
    <thead>
    <tr>
        <th>Produto</th>
        <th>Qtd</th>
        <th>Preço Unit.</th>
        <th>Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${pedido.itens}">
        <td th:text="${item.produto.nomeProduto}"></td>
        <td class="text-center" th:text="${item.quantidade}"></td>
        <td class="text-right" th:text="'R$ ' + ${item.valorUnitario}"></td>
        <td class="text-right" th:text="'R$ ' + (${item.valorUnitario} * ${item.quantidade})"></td>
    </tr>
    </tbody>
</table>

<div class="total">
    <p>Valor Total: R$ <span th:text="${pedido.valorTotal}"></span></p>
</div>
</body>
</html>
