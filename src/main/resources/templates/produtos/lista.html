<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('produtos')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Catálogo de Produtos</h3>
            <a th:href="@{/produtos/novo}" class="btn btn-purple"><i class="bi bi-box-seam-fill"></i> Novo Produto</a>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço Custo</th>
                    <th>Preço Venda</th>
                    <th>Estoque Mínimo</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}">
                    <td class="fw-semibold" th:text="${p.nomeProduto}"></td>
                    <td><span class="badge bg-light text-dark border" th:text="${p.categoria != null ? p.categoria.nomeCategoria : 'Sem Categoria'}"></span></td>
                    <td th:text="'R$ ' + ${p.precoCusto}"></td>
                    <td class="fw-bold text-success" th:text="'R$ ' + ${p.precoVenda}"></td>
                    <td th:text="${p.estoqueMinimo} + ' un.'"></td>
                    <td>
                        <a th:href="@{/produtos/editar/{id}(id=${p.idProduto})}" class="btn btn-outline-primary btn-sm me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/produtos/excluir/{id}(id=${p.idProduto})}" class="btn btn-outline-danger btn-sm" onclick="return confirm('Deseja excluir este produto?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
