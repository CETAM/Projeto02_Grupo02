<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Produtos em Falta</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 2cm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: Arial, sans-serif;
                font-size: 10pt;
            }
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }
        h3 {
            color: #dc3545; /* vermelho/danger */
            margin-bottom: 5px;
        }
        .header {
            border-bottom: 2px solid #dc3545;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        thead {
            display: table-header-group;
            background-color: #f8f9fa;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            font-weight: bold;
        }
        .danger {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="header">
    <h3>Produtos com Estoque Crítico</h3>
</div>

<table>
    <thead>
    <tr>
        <th>Produto</th>
        <th>Categoria</th>
        <th>Estoque Atual</th>
        <th>Estoque Mínimo</th>
        <th>Situação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${estoques}">
        <td th:text="${e.produto.nomeProduto}"></td>
        <td th:text="${e.produto.categoria != null ? e.produto.categoria.nomeCategoria : '—'}"></td>
        <td class="danger" th:text="${e.quantidadeAtual}"></td>
        <td th:text="${e.produto.estoqueMinimo}"></td>
        <td>
            <span th:if="${e.quantidadeAtual <= 0}">Esgotado</span>
            <span th:unless="${e.quantidadeAtual <= 0}">Abaixo do Mínimo</span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
