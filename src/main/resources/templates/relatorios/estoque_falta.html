<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Produtos em Falta')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('relatorios')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Produtos com Estoque Crítico</h3>
            <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Estoque Atual</th>
                    <th>Estoque Mínimo</th>
                    <th>Situação</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estoques}">
                    <td class="fw-semibold" th:text="${e.produto.nomeProduto}"></td>
                    <td th:text="${e.produto.categoria != null ? e.produto.categoria.nomeCategoria : '—'}"></td>
                    <td class="fw-bold text-danger fs-5" th:text="${e.quantidadeAtual}"></td>
                    <td th:text="${e.produto.estoqueMinimo}"></td>
                    <td>
                        <span class="badge bg-danger" th:if="${e.quantidadeAtual <= 0}">Esgotado</span>
                        <span class="badge bg-warning text-dark" th:unless="${e.quantidadeAtual <= 0}">Abaixo do Mínimo</span>
                    </td>
                </tr>
                </tbody>
            </table>
            <a th:href="@{/relatorios}" class="btn btn-light border btn-sm mt-3">Voltar</a>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
