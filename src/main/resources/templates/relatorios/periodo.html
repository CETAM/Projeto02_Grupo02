<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Relatório por Período</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 2cm;
            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: Arial, sans-serif;
                font-size: 10pt;
            }
        }
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }
        h3 {
            color: #0056b3;
            margin-bottom: 5px;
        }
        .header {
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        thead {
            display: table-header-group;
            background-color: #f8f9fa;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="header">
    <h3>Vendas por Período</h3>
    <span th:text="'Intervalo: ' + ${#temporals.format(dataInicio, 'dd/MM/yyyy')} + ' até ' + ${#temporals.format(dataFim, 'dd/MM/yyyy')}"></span>
</div>

<table>
    <thead>
    <tr>
        <th># ID</th>
        <th>Cliente</th>
        <th>Data</th>
        <th>Valor Total</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pedidos}">
        <td th:text="'PED-' + ${p.idPedido}"></td>
        <td th:text="${p.cliente.nomeCliente}"></td>
        <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="'R$ ' + ${p.valorTotal}"></td>
        <td th:text="${p.statusPedido}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
