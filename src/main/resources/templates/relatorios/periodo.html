<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Relatório por Período')}"></head>
<body class="d-flex">
<div th:replace="~{fragments/layout :: sidebar('relatorios')}"></div>
<div class="flex-grow-1 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>
    <main class="p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0">Vendas por Período</h3>
                <span class="text-muted" th:text="'Intervalo: ' + ${#temporals.format(dataInicio, 'dd/MM/yyyy')} + ' até ' + ${#temporals.format(dataFim, 'dd/MM/yyyy')}"></span>
            </div>
            <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
        </div>

        <div class="card card-custom p-4 bg-white">
            <table class="table align-middle">
                <thead class="table-light">
                <tr>
                    <th># ID</th>
                    <th>Cliente</th>
                    <th>Data</th>
                    <th>Valor Total</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pedidos}">
                    <td class="fw-bold" th:text="'PED-' + ${p.idPedido}"></td>
                    <td th:text="${p.cliente.nomeCliente}"></td>
                    <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="fw-bold text-success" th:text="'R$ ' + ${p.valorTotal}"></td>
                    <td><span class="badge bg-success" th:text="${p.statusPedido}"></span></td>
                </tr>
                </tbody>
            </table>
            <a th:href="@{/relatorios}" class="btn btn-light border btn-sm mt-3">Voltar</a>
        </div>
    </main>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
